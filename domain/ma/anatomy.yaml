# Agreement anatomy for long mode: the parts an author outlines, in order,
# each with its share of the band target, and the clauses the agreement must
# contain — almost all in ordinary, benign form. The list says what is
# PRESENT, never what it says.
# Spec §6. Provenance (CUAD's 41 categories restated as English-law headings;
# MAUD's section shares for the SPA; the Model Commercial Lease and the
# Companies Act model articles as UK anchors): TECHNICAL-NOTES.md,
# "Long-form documents". Shares are integers summing to 100 — the loader
# refuses anything else.
families:
  commercial-supply:
    title: "Supply or services agreement"
