finding_archetypes:
  corporate: ["defective share allotment", "unregistered charge", "missing board approval for a related-party transaction", "pre-emption rights not waived"]
  financial: ["provision materially below the underlying estimate", "revenue recognised early on a milestone contract", "undisclosed related-party balance"]
  tax: ["transfer-pricing policy unsupported by documentation", "VAT treatment inconsistent across group entities", "open enquiry not provided for"]
  financing: ["covenant headroom below the certified figure", "change-of-control prepayment trigger", "security granted outside the permitted basket"]
  commercial: ["change-of-control consent in the largest customer contract", "most-favoured-nation clause", "uncapped liability in a supply agreement", "auto-renewal past the expected exit"]
  ip: ["founder IP never assigned", "copyleft-licensed component in shipped product", "lapsed registration in a core market"]
  it: ["unremediated intrusion", "software in use beyond its licence entitlement", "no tested disaster-recovery capability"]
  property: ["break option missed", "title defect on an operating site", "unresolved dilapidations liability"]
  employment: ["misclassified contractors", "collective consultation not run", "unexercisable share options on a change of control"]
  regulatory: ["unfiled voluntary disclosure", "authorisation expiring before completion", "sanctions exposure through an intermediary"]
  environmental: ["remediation estimate far above the balance-sheet provision", "expired indemnity", "permit condition breached and unreported"]
  insurance: ["policy exclusion defeating the main exposure", "claims history inconsistent with the disclosed record", "no run-off cover arranged"]
  pensions: ["buy-out deficit far above the disclosed technical-provisions deficit", "covenant weakened by an earlier recapitalisation"]
  data: ["international transfers without a valid mechanism", "unreported personal-data breach", "processor agreement missing"]
  litigation: ["claim understated in the disputes schedule", "settlement with an ongoing obligation", "regulatory investigation not disclosed"]
  operations: ["single-source supplier with no alternative qualified", "open corrective actions on a critical process", "capacity below contracted commitments"]
  management: ["forecast assumption unsupported by the underlying data", "trading update inconsistent with management accounts"]
  transaction: ["warranty disclosed against the wrong schedule", "leakage item inside the locked-box period", "W&I exclusion landing on a known exposure"]
  esg: ["substantiation missing for a public green claim", "supply-chain diligence not performed", "reported metric inconsistent with the source data"]
  jv: ["right of first refusal triggered by the transaction", "deadlock provision favouring the minority", "borrowing threshold breached"]
